*/\\n  var SHEET_COLS = 12, TS = 16;\\n\\n  var T = {                       /* 地形 / 场景物 */\\n    floor: [48, 49, 50, 51],      /* 沙岩地砖（4 个变体，随机铺） */\\n    wall: [40, 28, 57, 58, 59],   /* 石砖墙 */\\n    stairs: 63,                   /* 木梯 = 下一层入口 */\\n    gate: 43,                     /* 铁栅门（Boss 层） */\\n    torch: [21, 32, 33],          /* 墙火把 */\\n    chest: 90, chestOpen: 92,\\n    barrel: 61, barrel2: 62,      /* 木桶（可打碎） */\\n    crate: 54, crate2: 55, ring: 56,\\n    altar: 31, tomb: 43, statue: 74, pillar: 64, brazier: 33, table: 72,\\n    shrine: 70,                   /* 神龛拱门 */\\n    portal: 8,                    /* 绿色魔法门 */\\n    well: 55                      /* 石井 */\\n  };\\n  var S = {                       /* 角色 / 怪物 / 道具 */\\n    hero: 85, knight: 96, wizard: 84, heroAlt: 88,\\n    /* 怪物 */\\n    bat: 120, slime: 108, goblin: 112, spider: 122, wraith: 111,\\n    crab: 110, ghost: 121, rogue: 100, skull: 124,\\n    snake: 123, slimeO: 109, boss: 82,\\n    /* NPC */\\n    merchant: 101, merchantF: 100, villager: 101,\\n    /* 道具 */\\n    potionR: 115, potionG: 114, potionB: 116, potionGray: 113,\\n    dagger: 103, sword: 104, knife: 105, longsword: 106, hammer: 117, axe: 118,\\n    spear: 107, staff: 126, wand: 125,\\n    gem: 32, coin: 101\\n  };\\n\\n  /* ================= 数值表 ================= */\\n  /* AI 行为：chase=直线追人 / ranged=远程 / skit=打了就退 / swarm=群起 / boss=首领 */\\n  var MONSTERS = [\\n    { id: 'bat',    name: '洞穴蝙蝠', spr: S.bat,    hp: 6,  atk: 3,  def: 0, xp: 3,  f: [1, 4],  ai: 'swarm',  sense: 7,  speed: 2 },\\n    { id: 'slime',  name: '史莱姆',   spr: S.slime,  hp: 10, atk: 4,  def: 1, xp: 5,  f: [1, 5],  ai: 'chase',  sense: 5,  speed: 1 },\\n    { id: 'goblin', name: '哥布林',   spr: S.goblin, hp: 14, atk: 5,  def: 1, xp: 7,  f: [2, 6],  ai: 'chase',  sense: 6,  speed: 1 },\\n    { id: 'spider', name: '巨蛛',     spr: S.spider, hp: 12, atk: 6,  def: 1, xp: 8,  f: [3, 7],  ai: 'skit',   sense: 6,  speed: 1 },\\n    { id: 'snake',  name: '毒蛇',     spr: S.snake,  hp: 13, atk: 5,  def: 1, xp: 8,  f: [3, 7],  ai: 'chase',  sense: 6,  speed: 1, poison: 2 },\\n    { id: 'wraith', name: '幽魂',     spr: S.wraith, hp: 16, atk: 7,  def: 2, xp: 11, f: [4, 8],  ai: 'ranged', sense: 8,  speed: 1 },\\n    { id: 'crab',   name: '赤甲怪',   spr: S.crab,   hp: 21, atk: 8,  def: 3, xp: 13, f: [5, 9],  ai: 'chase',  sense: 6,  speed: 1 },\\n    { id: 'ghost',  name: '怨灵',     spr: S.ghost,  hp: 18, atk: 9,  def: 3, xp: 15, f: [6, 10], ai: 'skit',   sense: 8,  speed: 2 },\\n    { id: 'rogue',  name: '夺宝贼',   spr: S.rogue,  hp: 24, atk: 10, def: 3, xp: 19, f: [7, 10], ai: 'swarm',  sense: 8,  speed: 2 },\\n    { id: 'skull',  name: '骸骨守卫', spr: S.skull,  hp: 34, atk: 12, def: 5, xp: 30, f: [8, 10], ai: 'chase',  sense: 7,  speed: 1, elite: true }\\n  ];\\n  var WEAPONS = [\\n    { name: '匕首', spr: S.dagger,    atk: 2 },\\n    { name: '短剑', spr: S.knife,     atk: 3 },\\n    { name: '长剑', spr: S.sword,     atk: 5 },\\n    { name: '重刃', spr: S.longsword, atk: 7 },\\n    { name: '战锤', spr: S.hammer,    atk: 9 },\\n    { name: '双刃斧', spr: S.axe,     atk: 11 }\\n  ];\\n  /* 主动技能：能量条 = 击杀 + 回合累积，满了才能放 */\\n  var SKILLS = [\\n    { id: 'pierce', name: '穿刺斩', spr: S.spear, cost: 40, cd: 3, desc: '对相邻格一次造成 1.6 倍伤害，并击退到墙边' },\\n    { id: 'bolt',   name: '奥术弹', spr: S.wand,  cost: 40, cd: 3, desc: '朝面向方向射出一道奥术光，命中最近的两个敌人' },\\n    { id: 'mend',   name: '治愈术', spr: S.potionG, cost: 60, cd: 5, desc: '立刻回复 40% 体力上限' },\\n    { id: 'quake',  name: '震地',   spr: S.hammer, cost: 70, cd: 6, desc: '全屏震荡，对视野内所有敌人造成伤害并眩晕一回合' }\\n  ];\\n  var MAX_FLOOR = 12;\\n  var BOSS_FLOOR = 12;\\n\\n  /* ================= 小工具 ================= */\\n  function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\\n  function choice(a) { return a[Math.floor(Math.random() * a.length)]; }\\n  function dist(a, b, c, d) { return Math.max(Math.abs(a - c), Math.abs(b - d)); }\\n  function edist(a, b, c, d) { var dx = a - c, dy = b - d; return Math.sqrt(dx * dx + dy * dy); }\\n\\n  global.GOBArogue = {\\n    version: '2.0.0',\\n    /* 运行起来之后，这里会被填上真实的 Goba.Game 实例 / 画布 / 场景。\\n       给外部（Studio 运行时、自动化验证脚本）一个稳定抓手用，\\n       省得靠\\\"在 DOM 里翻 canvas\\\"这种脆办法去猜哪张是肉鸽的。 */\\n    instance: null,\\n    canvas: null,\\n    scene: null,\\n    ready: false,\\n    logs: [],\\n    /* parent（可选）：把游戏画布挂到指定容器里，而不是整个 document.body。\\n       嵌进 GOBAgame Studio 的运行时用得到 —— 那里有自己的运行容器。 */\\n    boot: function (Goba, assets, parent) {\\n      var sheet = new Image();\\n      sheet.onload = function () { start(Goba, assets, sheet, parent); };\\n      sheet.onerror = function () {\\n        if (parent && parent.appendChild) {\\n          var p = document.createElement('p');\\n          p.style.cssText = 'color:#f66;font:14px sans-serif;padding:20px';\\n          p.textContent = '素材图集加载失败';\\n          parent.appendChild(p);\\n        } else {\\n          document.body.innerHTML = '<p style=\\\"color:#f66;font:14px sans-serif;padding:20px\\\">素材图集加载失败</p>';\\n        }\\n      };\\n      sheet.src = assets.sheet;\\n    }\\n  };\\n\\n  function start(Goba, assets, sheet, parent) {\\n    var CW = 360, CH = 640, TILE = 32;\\n    var MW = 46, MH = 36;                 /* 地牢格数 */\\n\\n    var ROCK = 0, FLOOR = 1, WALL = 2, STAIRS = 3;\\n\\n    var game = new Goba.Game({ width: CW, height: CH, parent: parent || document.body });\\n    var scene = new Goba.Scene(game);\\n    scene.bg = '#07080c';\\n    scene.worldWidth = MW * TILE;\\n    scene.worldHeight = MH * TILE;\\n\\n    /* 把真实实例亮出来给外部抓（Studio 运行时 / 自动化验证脚本） */\\n    global.GOBArogue.instance = game;\\n    global.GOBArogue.canvas = game.canvas;\\n    global.GOBArogue.scene = scene;\\n    global.GOBArogue.ready = true;\\n    var _log = function (m) {\\n      try { global.GOBArogue.logs.push(String(m)); } catch (e) { /* 忽略 */ }\\n    };\\n    _log('start ' + CW + 'x' + CH);\\n    /* 场景里的实体也亮一份计数出来，方便断言\\\"地牢真的建好了\\\" */\\n    try { _log('world ' + scene.worldWidth + 'x' + scene.worldHeight); } catch (e) { /* 忽略 */ }\\n\\n    var fx = new Goba.Particles(scene, { count: 12, speed: 130, life: 0.5, size: 5, gravity: 180 });\\n\\n    /* ---- 音效（Kenney 音效包，构建时内联成 data: URI） ---- */\\n    var SFX = {\\n      step: function () { Goba.sound.play('step', { vol: 0.22 }); },\\n      hit: function () { Goba.sound.play('hit', { vol: 0.3 }); Goba.audio.beep(180, 0.06, 'square', 0.06); },\\n      hurt: function () { Goba.sound.play('hurt', { vol: 0.45 }); },\\n      loot: function () { Goba.sound.play('loot', { vol: 0.4 }); },\\n      kill: function () { Goba.sound.play('kill', { vol: 0.35 }); },\\n      stairs: function () { Goba.sound.play('stairs', { vol: 0.5 }); },\\n      dead: function () { Goba.sound.play('dead', { vol: 0.55 }); },\\n      skill: function () { Goba.audio.beep(620, 0.16, 'sawtooth', 0.12, 400); },\\n      shop: function () { Goba.audio.beep(880, 0.09, 'square', 0.1); Goba.audio.beep(1180, 0.09, 'square', 0.08); },\\n      trap: function () { Goba.audio.beep(140, 0.2, 'square', 0.14, -60); }\\n    };\\n    Goba.sound.register(assets.sfx || {});\\n\\n    /* ================= 游戏状态 ================= */\\n    var p, map, rooms, mons, items, decor, traps, npcs, floorNo, over, won, msgLines, animClock = 0;\\n    var killCount = 0, turnCount = 0, combo = 0, comboTimer = 0, bestDamage = 0, shrinesUsed = 0;\\n\\n    function newPlayer() {\\n      return {\\n        gx: 0, gy: 0, hp: 30, maxHp: 30, atk: 4, def: 1, lv: 1, xp: 0, next: 8,\\n        gems: 0, weapon: null, hitT: 0, fx: 1, fy: 0,\\n        energy: 0, maxEnergy: 100, skills: [0], weaponIdx: -1,\\n        shield: 0, poison: 0, stun: 0, invuln: 0\\n      };\\n    }\\n    p = newPlayer();\\n\\n    var itemUid = 0;\\n    function mkItem(kind, x, y, extra) {\\n      var it = { id: ++itemUid, kind: kind, gx: x, gy: y, bob: Math.random() * 6 };\\n      if (extra) for (var k in extra) it[k] = extra[k];\\n      items.push(it);\\n      return it;\\n    }\\n    function killItemEntity(id) {\\n      for (var i = 0; i < itemEnts.length; i++) if (itemEnts[i]._iid === id) itemEnts[i].dead = true;\\n    }\\n\\n    /* ================= 地图生成 ================= */\\n    function genLevel() {\\n      map = []; rooms = []; mons = []; items = []; decor = []; traps = []; npcs = [];\\n      for (var y = 0; y < MH; y++) {\\n        map.push(new Array(MW).fill(ROCK));\\n      }\\n      var tries = 220, want = rint(10, 14);\\n      for (var i = 0; i < tries && rooms.length < want; i++) {\\n        var w = rint(5, 10), h = rint(4, 8);\\n        var rx = rint(1, MW - w - 2), ry = rint(1, MH - h - 2);\\n        var ok = true;\\n        for (var k = 0; k < rooms.length; k++) {\\n          var r = rooms[k];\\n          if (rx - 2 < r.x + r.w && rx + w + 2 > r.x && ry - 2 < r.y + r.h && ry + h + 2 > r.y) { ok = false; break; }\\n        }\\n        if (!ok) continue;\\n        var room = { x: rx, y: ry, w: w, h: h, cx: Math.floor(rx + w / 2), cy: Math.floor(ry + h / 2), id: rooms.length };\\n        rooms.push(room);\\n        for (var yy = ry; yy < ry + h; yy++) for (var xx = rx; xx < rx + w; xx++) map[yy][xx] = FLOOR;\\n      }\\n      /* 走廊：连成一条链 + 额外随机连边，形成环路（不再是树，走路更有选择） */\\n      for (var j = 1; j < rooms.length; j++) carve(rooms[j - 1], rooms[j]);\\n      var extraLinks = Math.floor(rooms.length / 3);\\n      for (var e = 0; e < extraLinks; e++) {\\n        var a2 = rooms[rint(0, rooms.length - 1)], b2 = rooms[rint(0, rooms.length - 1)];\\n        if (a2 !== b2) carve(a2, b2);\\n      }\\n      /* 岩石贴墙 */\\n      for (y = 0; y < MH; y++) for (var x = 0; x < MW; x++) {\\n        if (map[y][x] !== ROCK) continue;\\n        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {\\n          var nx = x + dx, ny = y + dy;\\n          if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;\\n          if (map[ny][nx] === FLOOR || map[ny][nx] === STAIRS) { map[y][x] = WALL; dy = 2; break; }\\n        }\\n      }\\n      /* 玩家在最靠左上房间 */\\n      rooms.sort(function (q, w2) { return (q.cx + q.cy) - (w2.cx + w2.cy); });\\n      p.gx = rooms[0].cx; p.gy = rooms[0].cy; map[p.gy][p.gx] = FLOOR;\\n      /* 楼梯在离玩家最远房间 */\\n      var far = rooms[rooms.length - 1];\\n      map[far.cy][far.cx] = STAIRS;\\n\\n      var isBoss = (floorNo === BOSS_FLOOR);\\n      var pool = MONSTERS.filter(function (m) { return floorNo >= m.f[0] && floorNo <= m.f[1]; });\\n      if (!pool.length) pool = [MONSTERS[0]];\\n      var n = Math.min(26, 6 + floorNo * 2);\\n      for (i = 0; i < n; i++) {\\n        var rr = choice(rooms), gx = rint(rr.x, rr.x + rr.w - 1), gy = rint(rr.y, rr.y + rr.h - 1);\\n        if (map[gy][gx] !== FLOOR) continue;\\n        if (dist(gx, gy, p.gx, p.gy) < 6) continue;\\n        if (monsterAt(gx, gy)) continue;\\n        spawnMonsterAt(choice(pool), gx, gy);\\n      }\\n      /* 精英怪：每层有概率出 1-2 只加强版，掉落更好 */\\n      if (floorNo >= 3 && Math.random() < 0.7) {\\n        for (var el = 0; el < rint(1, 2); el++) {\\n          var re = choice(rooms), ex = rint(re.x, re.x + re.w - 1), ey = rint(re.y, re.y + re.h - 1);\\n          if (map[ey][ex] !== FLOOR || monsterAt(ex, ey) || dist(ex, ey, p.gx, p.gy) < 8) continue;\\n          spawnMonsterAt(choice(pool), ex, ey, { elite: true });\\n        }\\n      }\\n      /* Boss 层：中间房间的尽头放首领 */\\n      if (isBoss) {\\n        var br = rooms[rooms.length - 2] || far;\\n        spawnMonsterAt({ id: 'boss', name: '深渊主宰', spr: S.boss, hp: 150, atk: 16, def: 6, xp: 120 }, br.cx, br.cy, { boss: true, ranged: true });\\n      }\\n\\n      /* ---- 道具 ---- */\\n      var drop = function (kind, extra) {\\n        for (var a3 = 0; a3 < 40; a3++) {\\n          var rx3 = choice(rooms), x4 = rint(rx3.x, rx3.x + rx3.w - 1), y4 = rint(rx3.y, rx3.y + rx3.h - 1);\\n          if (map[y4][x4] !== FLOOR) continue;\\n          if (x4 === p.gx && y4 === p.gy) continue;\\n          if (monsterAt(x4, y4)) continue;\\n          return mkItem(kind, x4, y4, extra);\\n        }\\n        return null;\\n      };\\n      drop('potion', { sub: 'heal' });\\n      drop('potion', { sub: 'heal' });\\n      if (floorNo % 3 === 0) drop('potion', { sub: 'max' });\\n      if (Math.random() < 0.6) drop('potion', { sub: 'power' });\\n      for (i = 0; i < rint(4, 8); i++) drop('gem');\\n      for (i = 0; i < rint(2, 4); i++) drop('chest');\\n      /* 可打碎的木桶/木箱，打碎掉东西 */\\n      for (i = 0; i < rint(4, 9); i++) {\\n        var rb = choice(rooms), bx = rint(rb.x, rb.x + rb.w - 1), by = rint(rb.y, rb.y + rb.h - 1);\\n        if (map[by][bx] !== FLOOR || (bx === p.gx && by === p.gy)) continue;\\n        if (monsterAt(bx, by) || itemAt(bx, by)) continue;\\n        if (barrelAt(bx, by)) continue;\\n        mkItem('barrel', bx, by, { loot: Math.random() < 0.6 ? 'gem' : 'hp' });\\n      }\\n      if (Math.random() < 0.5) {\\n        var wifi = Math.min(WEAPONS.length - 1, Math.floor(floorNo / 2));\\n        drop('weapon', { wi: rint(Math.max(0, wifi - 3), wifi) });\\n      }\\n\\n      /* ---- 陷阱（固定伤害，踩上去掉血，可以看见） ---- */\\n      for (i = 0; i < rint(2, 5); i++) {\\n        var rt = choice(rooms), tx = rint(rt.x + 1, rt.x + rt.w - 2), ty = rint(rt.y + 1, rt.y + rt.h - 2);\\n        if (map[ty][tx] !== FLOOR) continue;\\n        if (tx === p.gx && ty === p.gy) continue;\\n        if (itemAt(tx, ty) || monsterAt(tx, ty)) continue;\\n        traps.push({ gx: tx, gy: ty, dmg: 3 + floorNo, armed: true });\\n      }\\n\\n      /* ---- 神龛（三选一升级） ---- */\\n      if (floorNo % 2 === 0 || Math.random() < 0.5) {\\n        var rs = choice(rooms), sx = rint(rs.x + 1, rs.x + rs.w - 2), sy = rint(rs.y + 1, rs.y + rs.h - 2);\\n        if (map[sy][sx] === FLOOR && !(sx === p.gx && sy === p.gy) && !itemAt(sx, sy) && !monsterAt(sx, sy)) {\\n          mkItem('shrine', sx, sy);\\n        }\\n      }\\n      /* ---- 商店 NPC ---- */\\n      if (floorNo >= 2 && floorNo % 2 === 0) {\\n        var rm = choice(rooms), mx = rint(rm.x + 1, rm.x + rm.w - 2), my = rint(rm.y + 1, rm.y + rm.h - 2);\\n        if (map[my][mx] === FLOOR && !(mx === p.gx && my === p.gy) && !itemAt(mx, my) && !monsterAt(mx, my)) {\\n          npcs.push({ gx: mx, gy: my, kind: 'merchant', name: '流浪商人' });\\n        }\\n      }\\n\\n      /* ---- 装饰 ---- */\\n      for (i = 0; i < rint(10, 20); i++) {\\n        var rd = choice(rooms), dx2 = rint(rd.x, rd.x + rd.w - 1), dy2 = rint(rd.y, rd.y + rd.h - 1);\\n        if (map[dy2][dx2] !== FLOOR) continue;\\n        if (dx2 === p.gx && dy2 === p.gy) continue;\\n        if (decor.some(function (d) { return d.gx === dx2 && d.gy === dy2; })) continue;\\n        if (monsterAt(dx2, dy2) || itemAt(dx2, dy2) || npcAt(dx2, dy2)) continue;\\n        decor.push({ gx: dx2, gy: dy2, spr: choice([T.crate, T.crate2, T.tomb, T.statue, T.pillar, T.brazier, T.table, T.ring, T.well]) });\\n      }\\n\\n      msg('⛓ 你踏入了地牢第 ' + floorNo + ' 层。', '#9fd8ff');\\n      if (isBoss) msg('☠ 空气变得沉重……这一层有首领。', '#ff9d7a');\\n    }\\n    function carve(a, b) {\\n      var x0 = a.cx, y0 = a.cy, x1 = b.cx, y1 = b.cy;\\n      if (Math.random() < 0.5) {\\n        for (var x2 = Math.min(x0, x1); x2 <= Math.max(x0, x1); x2++) if (map[y0][x2] === ROCK) map[y0][x2] = FLOOR;\\n        for (var y2 = Math.min(y0, y1); y2 <= Math.max(y0, y1); y2++) if (map[y2][x1] === ROCK) map[y2][x1] = FLOOR;\\n      } else {\\n        for (var y3 = Math.min(y0, y1); y3 <= Math.max(y0, y1); y3++) if (map[y3][x0] === ROCK) map[y3][x0] = FLOOR;\\n        for (var x3 = Math.min(x0, x1); x3 <= Math.max(x0, x1); x3++) if (map[y1][x3] === ROCK) map[y1][x3] = FLOOR;\\n      }\\n    }\\n\\n    function spawnMonsterAt(t, x, y, opts) {\\n      var bump = floorNo - 1, mul = (opts && opts.elite) ? 1.6 : 1;\\n      var hp = Math.round((t.hp + Math.floor(bump * 2.4)) * mul);\\n      var m = {\\n        kind: t.id, name: (opts && opts.boss ? t.name : ((opts && opts.elite) ? '精英·' + t.name : t.name)),\\n        spr: t.spr, gx: x, gy: y, ax: x, ay: y,\\n        hp: hp, maxHp: hp,\\n        atk: Math.round((t.atk + Math.floor(bump * 0.9)) * (mul > 1 ? 1.2 : 1)),\\n        def: t.def + Math.floor(bump / 4), xp: Math.round(t.xp * mul),\\n        hitT: 0, ai: (opts && opts.ranged ? 'ranged' : (t.ai || 'chase')),\\n        sense: t.sense || 6, speed: t.speed || 1,\\n        elite: !!(opts && opts.elite), boss: !!(opts && opts.boss),\\n        poison: t.poison || 0,\\n        stun: 0, alerted: false, cd: 0, anim: Math.random() * 6,\\n        lootTier: (opts && opts.boss) ? 3 : ((opts && opts.elite) ? 2 : 1)\\n      };\\n      m.spr = m.boss ? S.boss : (opts && opts.boss ? t.spr : t.spr);\\n      mons.push(m);\\n      return m;\\n    }\\n\\n    /* ================= 查询 ================= */\\n    function inb(x, y) { return x >= 0 && y >= 0 && x < MW && y < MH; }\\n    function tileAt(x, y) { return inb(x, y) ? map[y][x] : ROCK; }\\n    function walkable(x, y) { var t = tileAt(x, y); return t === FLOOR || t === STAIRS; }\\n    function monsterAt(x, y) {\\n      for (var i = 0; i < mons.length; i++) if (mons[i].hp > 0 && mons[i].gx === x && mons[i].gy === y) return mons[i];\\n      return null;\\n    }\\n    function itemAt(x, y) {\\n      for (var i = 0; i < items.length; i++) if (items[i].gx === x && items[i].gy === y && items[i].kind !== 'shrine') return items[i];\\n      return null;\\n    }\\n    function barrelAt(x, y) {\\n      for (var i = 0; i < items.length; i++) if (items[i].gx === x && items[i].gy === y && items[i].kind === 'barrel') return items[i];\\n      return null;\\n    }\\n    function npcAt(x, y) {\\n      for (var i = 0; i < npcs.length; i++) if (npcs[i].gx === x && npcs[i].gy === y) return npcs[i];\\n      return null;\\n    }\\n    function trapAt(x, y) {\\n      for (var i = 0; i < traps.length; i++) if (traps[i].gx === x && traps[i].gy === y && traps[i].armed) return traps[i];\\n      return null;\\n    }\\n    function blocked(x, y) {\\n      if (!walkable(x, y)) return true;\\n      return !!(monsterAt(x, y) || npcAt(x, y) || barrelAt(x, y));\\n    }\\n    /* 视线检测（怪物感知用；地图全亮但墙依然挡路） */\\n    function los(x0, y0, x1, y1) {\\n      var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);\\n      var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;\\n      var x = x0, y = y0, guard = 0;\\n      while (guard++ < 300) {\\n        if (x === x1 && y === y1) return true;\\n        var e2 = err * 2;\\n        if (e2 > -dy) { err -= dy; x += sx; }\\n        if (e2 < dx) { err += dx; y += sy; }\\n        if (x === x1 && y === y1) return true;\\n        if (tileAt(x, y) === WALL) return false;\\n      }\\n      return false;\\n    }\\n    /* BFS 寻路：怪物绕过墙角追人（旧版只会\\\"先横后竖\\\"，卡墙就原地打转） */\\n    function pathStep(m, goalX, goalY) {\\n      if (m.gx === goalX && m.gy === goalY) return null;\\n      var q = [[m.gx, m.gy]], head = 0, prev = {}, seen = {};\\n      seen[m.gy * MW + m.gx] = 1;\\n      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];\\n      var found = false;\\n      while (head < q.length && q.length < 900) {\\n        var cur = q[head++], cx = cur[0], cy = cur[1];\\n        if (cx === goalX && cy === goalY) { found = true; break; }\\n        for (var i = 0; i < 4; i++) {\\n          var nx = cx + dirs[i][0], ny = cy + dirs[i][1], key = ny * MW + nx;\\n          if (!walkable(nx, ny) || seen[key]) continue;\\n          if (!(nx === goalX && ny === goalY) && monsterAt(nx, ny)) continue;\\n          seen[key] = 1; prev[key] = cur;\\n          q.push([nx, ny]);\\n        }\\n      }\\n      if (!found) return null;\\n      var path = [], node = [goalX, goalY];\\n      while (!(node[0] === m.gx && node[1] === m.gy)) {\\n        path.unshift(node);\\n        node = prev[node[1] * MW + node[0]];\\n        if (!node) return null;\\n      }\\n      return path.length ? path[0] : null;\\n    }\\n\\n    /* ================= 日志 / 战斗 ================= */\\n    function log(text, color) {\\n      msgLines.push({ t: text, c: color || '#c9d4e3' });\\n      if (msgLines.length > 40) msgLines.shift();\\n      if (logText) logText.text = msgLines.slice(-3).map(function (l) { return l.t; }).join('\\\\n');\\n    }\\n    function msg(text, color) { log(text, color); }\\n\\n    function attackMonster(m, mult) {\\n      mult = mult || 1;\\n      /* 连击：同一回合内打死多个敌人伤害递增 */\\n      var roll = Math.random();\\n      var crit = roll < 0.12;\\n      var raw = totalAtk() * mult + rint(-1, 1) - m.def;\\n      var dmg = Math.max(1, Math.round(crit ? raw * 1.7 : raw));\\n      if (dmg > bestDamage) bestDamage = dmg;\\n      m.hp -= dmg; m.hitT = 0.28; m.alerted = true;\\n      if (m.hp > 0 && m.ai === 'skit') m.fleeing = 2;\\n      fx.burst((m.gx + 0.5) * TILE, (m.gy + 0.5) * TILE, { color: crit ? ['#fff3a0', '#ffd93d', '#ff6b6b'] : ['#ffd93d', '#ff6b6b'], count: crit ? 14 : 8 });\\n      if (m.hp <= 0) {\\n        killCount++; combo++; comboTimer = 2.4;\\n        var bonus = combo > 1 ? (' · 连击 x' + combo) : '';\\n        log('你把 ' + m.name + ' 打倒了（+' + m.xp + ' 经验）' + bonus + '。', '#8ee6a0');\\n        SFX.kill(); gainXp(m.xp);\\n        if (m.hp <= 0 && !m._cashed) {\\n          m._cashed = true;\\n          dropLoot(m);\\n        }\\n      } else {\\n        log((crit ? '会心一击！' : '你击中 ') + m.name + '，造成 ' + dmg + ' 点伤害（剩 ' + m.hp + '）。', crit ? '#ffe08a' : '#ffe08a');\\n        SFX.hit();\\n      }\\n      return dmg;\\n    }\\n    function dropLoot(m) {\\n      var t = m.lootTier || 1;\\n      if (Math.random() < 0.5 * t && !itemAt(m.gx, m.gy)) mkItem('gem', m.gx, m.gy);\\n      if (m.boss) {\\n        mkItem('chest', m.gx, m.gy, { rich: true });\\n        msg('★ 深渊主宰倒下了，留下一个金光闪闪的宝箱！', '#ffe08a');\\n      } else if (m.elite && Math.random() < 0.7) {\\n        mkItem('chest', m.gx, m.gy, { rich: true });\\n      }\\n    }\\n    function gainXp(n) {\\n      p.xp += n;\\n      while (p.xp >= p.next) {\\n        p.xp -= p.next; p.lv++; p.maxHp += 6; p.hp = Math.min(p.maxHp, p.hp + 6); p.atk += 1;\\n        p.next = Math.round(p.next * 1.5);\\n        log('★ 升级！你是 Lv.' + p.lv + '，体力上限 +6、攻击 +1。', '#a0f0ff');\\n        fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#a0f0ff', count: 20, speed: 190 });\\n        /* 升级回一点能量 */\\n        p.energy = Math.min(p.maxEnergy, p.energy + 25);\\n      }\\n    }\\n    function hurtPlayer(n, from, color) {\\n      n = Math.max(1, n);\\n      p.hp -= n; p.hitT = 0.3;\\n      fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#ff6b6b', count: 8 });\\n      if (p.hp <= 0) { p.hp = 0; die(); return; }\\n      log(from + ' 击中你，受到 ' + n + ' 点伤害。', color || '#ffb3b3');\\n      SFX.hurt();\\n      game.scene.camera.shake(4, 0.16);\\n      combo = 0;\\n    }\\n    function die() {\\n      over = true; SFX.dead();\\n      log('你倒在了第 ' + floorNo + ' 层……', '#ff8080');\\n      showOverlay('你倒下了', '第 ' + floorNo + ' 层 · Lv.' + p.lv + ' · 宝石 ' + p.gems +\\n        ' · 击杀 ' + killCount + '\\\\n最高单次伤害 ' + bestDamage, '#ff8080');\\n    }\\n    function victory() {\\n      over = true; won = true;\\n      log('你带着深渊的回响走出了地牢！', '#ffe08a');\\n      showOverlay('★ 通关！', 'Lv.' + p.lv + ' · 宝石 ' + p.gems + ' · 击杀 ' + killCount +\\n        ' · 回合 ' + turnCount + '\\\\n最高单次伤害 ' + bestDamage, '#ffe08a');\\n    }\\n\\n    /* ================= 玩家行动 ================= */\\n    function playerAct(dx, dy) {\\n      if (over) return;\\n      turnCount++;\\n      if (dx || dy) { p.fx = dx || p.fx; p.fy = dy; }\\n      /* 中毒扣血 */\\n      if (p.poison > 0) {\\n        p.poison--;\\n        p.hp -= 2;\\n        if (p.hp <= 0) { p.hp = 0; die(); return; }\\n        log('毒素侵蚀，失去 2 点体力。', '#a0e0a0');\\n      }\\n      if (!dx && !dy) { log('你静静站定，回了一口气。', '#9aa8bd'); monsterTurn(); endTurn(); return; }\\n      var nx = p.gx + dx, ny = p.gy + dy;\\n\\n      /* 撞 NPC：打开商店 */\\n      var npc = npcAt(nx, ny);\\n      if (npc) { openShop(npc); return; }\\n      /* 撞怪物：攻击 */\\n      var m = monsterAt(nx, ny);\\n      if (m) { attackMonster(m); if (!over) { monsterTurn(); endTurn(); } return; }\\n      /* 撞木桶/木箱：打碎 */\\n      var bar = barrelAt(nx, ny);\\n      if (bar) {\\n        smashBarrel(bar);\\n        monsterTurn(); endTurn();\\n        return;\\n      }\\n      if (!walkable(nx, ny)) { log('前面是石墙。', '#8a97ae'); return; }\\n\\n      p.gx = nx; p.gy = ny;\\n      SFX.step();\\n      /* 踩陷阱 */\\n      var tr = trapAt(nx, ny);\\n      if (tr) { tr.armed = false; hurtPlayer(tr.dmg, '地刺陷阱', '#ffb3b3'); SFX.trap(); if (over) return; }\\n      pickupAt(nx, ny);\\n      if (over) return;\\n      if (map[ny][nx] === STAIRS) { descend(); return; }\\n      monsterTurn();\\n      endTurn();\\n    }\\n    function endTurn() {\\n      if (over) return;\\n      comboTimer = Math.max(0, comboTimer - 0.8);\\n      if (comboTimer <= 0) combo = 0;\\n      p.energy = Math.min(p.maxEnergy, p.energy + 4);\\n    }\\n\\n    function smashBarrel(bar) {\\n      var idx = items.indexOf(bar);\\n      if (idx >= 0) items.splice(idx, 1);\\n      killItemEntity(bar.id);\\n      fx.burst((bar.gx + 0.5) * TILE, (bar.gy + 0.5) * TILE, { color: ['#c98a4b', '#8a5a2b'], count: 12 });\\n      SFX.hit();\\n      if (bar.loot === 'hp') { p.hp = Math.min(p.maxHp, p.hp + 5); log('打碎木桶，里面是一点干粮（+5 体力）。', '#ff9db0'); }\\n      else { var g = rint(1, 3); p.gems += g; log('打碎木桶，滚出 ' + g + ' 颗宝石。', '#ffe08a'); }\\n      SFX.loot();\\n      turnCount++;\\n    }\\n\\n    function pickupAt(x, y) {\\n      for (var i = items.length - 1; i >= 0; i--) {\\n        var it = items[i];\\n        if (it.gx !== x || it.gy !== y) continue;\\n        if (it.kind === 'gem') { p.gems++; SFX.loot(); log('拾得一颗深渊宝石（共 ' + p.gems + '）。', '#ffe08a'); }\\n        else if (it.kind === 'potion') {\\n          if (it.sub === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 14); log('喝下红色药水，恢复 14 点体力。', '#ff9db0'); }\\n          else if (it.sub === 'max') { p.maxHp += 5; p.hp += 5; log('喝下绿色药水，体力上限 +5。', '#8ee6a0'); }\\n          else if (it.sub === 'power') { p.atk += 1; log('喝下蓝色药水，攻击 +1。', '#9fd8ff'); }\\n          else if (it.sub === 'energy') { p.energy = p.maxEnergy; log('喝下灰色药水，能量全满。', '#c9d4e3'); }\\n          SFX.loot();\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'weapon') {\\n          var w = WEAPONS[it.wi];\\n          if (!p.weapon || p.weapon.atk < w.atk) { p.weapon = w; p.weaponIdx = it.wi; log('捡起 ' + w.name + '（攻击 +' + w.atk + '）。', '#ffe08a'); }\\n          else log('这里的 ' + w.name + ' 不如手上的 ' + p.weapon.name + '，你把它丢下了。', '#9aa8bd');\\n          SFX.loot();\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'chest') {\\n          openChest(it, x, y);\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'shrine') {\\n          openShrine(it, x, y);\\n          return;   /* 神龛不销毁，可反复看（但只给一次） */\\n        }\\n      }\\n    }\\n    function openChest(it, x, y) {\\n      var rich = !!it.rich;\\n      var roll = Math.random();\\n      if (roll < (rich ? 0.25 : 0.4)) {\\n        var g = rich ? rint(6, 12) : rint(2, 4); p.gems += g;\\n        log('撬开宝箱，摸到 ' + g + ' 颗宝石。', '#ffe08a');\\n      } else if (roll < (rich ? 0.5 : 0.75)) {\\n        p.hp = Math.min(p.maxHp, p.hp + (rich ? 20 : 10));\\n        log('宝箱里是一瓶红色药水，恢复 ' + (rich ? 20 : 10) + ' 点体力。', '#ff9db0');\\n      } else {\\n        var tier = rich ? 2 : 0;\\n        var w2 = WEAPONS[Math.min(WEAPONS.length - 1, Math.floor(floorNo / 2) + rint(tier, tier + 1))];\\n        if (!p.weapon || p.weapon.atk < w2.atk) { p.weapon = w2; log('宝箱里是 ' + w2.name + '（攻击 +' + w2.atk + '）！', '#ffe08a'); }\\n        else { p.gems += rich ? 5 : 2; log('宝箱里是 ' + (rich ? 5 : 2) + ' 颗宝石。', '#ffe08a'); }\\n      }\\n      fx.burst((x + 0.5) * TILE, (y + 0.5) * TILE, { color: '#ffe08a', count: 16 });\\n      SFX.loot();\\n    }\\n    /* 神龛：三选一升级，每座只给一次 */\\n    function openShrine(it, x, y) {\\n      if (it.used) {\\n        log('这座神龛的祝福已被取走。', '#9aa8bd');\\n        return;\\n      }\\n      shrineOpen = true;\\n      shrineChoices = [\\n        { id: 'hp', name: '体魄', desc: '体力上限 +8，立刻回满', apply: function () { p.maxHp += 8; p.hp = p.maxHp; } },\\n        { id: 'atk', name: '锐锋', desc: '攻击 +2', apply: function () { p.atk += 2; } },\\n        { id: 'def', name: '铁壁', desc: '防御 +1，并获得 8 点护盾', apply: function () { p.def += 1; p.shield = (p.shield || 0) + 8; } }\\n      ];\\n      shrineRef = it;\\n      SFX.shop();\\n      log('你触摸了古老神龛，三道祝福在眼前浮现……（按 1 / 2 / 3 选择）', '#c9a0ff');\\n    }\\n    function chooseShrine(n) {\\n      if (!shrineOpen || !shrineChoices[n]) return;\\n      var c = shrineChoices[n];\\n      c.apply();\\n      if (shrineRef) { shrineRef.used = true; }\\n      shrineOpen = false; shrineChoices = null; shrineRef = null;\\n      shrinesUsed++;\\n      fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#c9a0ff', count: 22, speed: 200 });\\n      log('★ 你选择了「' + c.name + '」：' + c.desc + '。', '#c9a0ff');\\n      SFX.loot();\\n      monsterTurn(); endTurn();\\n    }\\n\\n    var shrineOpen = false, shrineChoices = null, shrineRef = null;\\n    var shopOpen = false, shopRef = null, shopStock = [];\\n\\n    /* 商店：花宝石买补给 */\\n    function openShop(npc) {\\n      shopOpen = true; shopRef = npc;\\n      if (!shopStock.length) shopStock = [\\n        { name: '红药水（回 18）', cost: 3, kind: 'potion', sub: 'heal' },\\n        { name: '蓝药水（攻击 +1）', cost: 6, kind: 'potion', sub: 'power' },\\n        { name: '绿色药水（上限 +5）', cost: 5, kind: 'potion', sub: 'max' },\\n        { name: '满能量（能量补满）', cost: 4, kind: 'energy' },\\n        { name: '强化武器（随机更高档）', cost: 8, kind: 'weapon' }\\n      ];\\n      SFX.shop();\\n      log('💠 商人：' + ('' + '欢迎，旅人。按 1-' + shopStock.length + ' 购买，0 离开。宝石：' + p.gems), '#ffe08a');\\n    }\\n    function buyFromShop(n) {\\n      if (!shopOpen) return;\\n      if (n < 0 || n >= shopStock.length) { shopOpen = false; log('你离开了商店。', '#9aa8bd'); return; }\\n      var s = shopStock[n];\\n      if (p.gems < s.cost) { log('宝石不够（需要 ' + s.cost + '，你有 ' + p.gems + '）。', '#ff8080'); return; }\\n      p.gems -= s.cost;\\n      if (s.kind === 'potion') {\\n        if (s.sub === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 18); log('商人递来红药水，恢复 18 点体力。', '#ff9db0'); }\\n        else if (s.sub === 'power') { p.atk += 1; log('喝下蓝药水，攻击 +1。', '#9fd8ff'); }\\n        else if (s.sub === 'max') { p.maxHp += 5; p.hp += 5; log('喝下绿药水，体力上限 +5。', '#8ee6a0'); }\\n      } else if (s.kind === 'energy') { p.energy = p.maxEnergy; log('一股暖流涌遍全身，能量补满。', '#c9d4e3'); }\\n      else if (s.kind === 'weapon') {\\n        var lo = Math.min(WEAPONS.length - 1, (p.weaponIdx < 0 ? 0 : p.weaponIdx) + 1);\\n        var w = WEAPONS[Math.min(WEAPONS.length - 1, lo + rint(0, 1))];\\n        if (!p.weapon || p.weapon.atk < w.atk) { p.weapon = w; log('商人换给你 ' + w.name + '（攻击 +' + w.atk + '）。', '#ffe08a'); }\\n        else { p.gems += s.cost; log('商人的货不如你手上的，他退回了宝石。', '#9aa8bd'); }\\n      }\\n      SFX.loot();\\n    }\\n\\n    /* ---- 技能 ---- */\\n    function useSkill(i) {\\n      if (over || shrineOpen || shopOpen) return;\\n      var sk = SKILLS[i];\\n      if (!sk) return;\\n      if (p.skills.indexOf(i) < 0) { log('你还没学会「' + sk.name + '」。', '#9aa8bd'); return; }\\n      if (p.energy < sk.cost) { log('能量不足（需要 ' + sk.cost + '）。', '#ff8080'); return; }\\n      p.energy -= sk.cost;\\n      SFX.skill();\\n      var eff = 0;\\n      if (sk.id === 'pierce') {\\n        var nx = p.gx + p.fx, ny = p.gy + p.fy, m;\\n        while (walkable(nx, ny) && !(m = monsterAt(nx, ny))) { nx += p.fx; ny += p.fy; }\\n        if (m) { eff = attackMonster(m, 1.6); msg('⚔ 穿刺斩命中 ' + m.name + '，造成 ' + eff + ' 点伤害！', '#a0f0ff'); }\\n        else msg('⚔ 穿刺斩划过空气。', '#9aa8bd');\\n      } else if (sk.id === 'bolt') {\\n        var bx = p.gx, by = p.gy, hits = 0;\\n        for (var st = 0; st < 10; st++) {\\n          bx += p.fx; by += p.fy;\\n          if (!walkable(bx, by)) break;\\n          var mm = monsterAt(bx, by);\\n          if (mm) {\\n            eff = attackMonster(mm, 1.1); hits++;\\n            fx.burst((bx + 0.5) * TILE, (by + 0.5) * TILE, { color: '#7ad8ff', count: 12 });\\n            if (hits >= 2) break;\\n          }\\n        }\\n        msg(hits ? ('✨ 奥术弹贯穿 ' + hits + ' 个敌人。') : '✨ 奥术弹消散在远处。', '#7ad8ff');\\n      } else if (sk.id === 'mend') {\\n        var heal = Math.round(p.maxHp * 0.4);\\n        p.hp = Math.min(p.maxHp, p.hp + heal);\\n        fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#8ee6a0', count: 20 });\\n        msg('✚ 治愈术回复 ' + heal + ' 点体力。', '#8ee6a0');\\n      } else if (sk.id === 'quake') {\\n        var cnt = 0;\\n        mons.forEach(function (m) {\\n          if (m.hp <= 0) return;\\n          if (dist(m.gx, m.gy, p.gx, p.gy) > 6) return;\\n          cnt++;\\n          attackMonster(m, 0.8);\\n          if (m.hp > 0) { m.stun = 2; m.stunFresh = 1; }  /* 打标记：本回合的 monsterTurn 不消耗这次眩晕 */\\n          fx.burst((m.gx + 0.5) * TILE, (m.gy + 0.5) * TILE, { color: '#d9a066', count: 10 });\\n        });\\n        game.scene.camera.shake(8, 0.35);\\n        msg('💥 震地！' + (cnt ? ('震荡了 ' + cnt + ' 个敌人并眩晕它们。') : '地面震颤，但附近没有敌人。'), '#d9a066');\\n      }\\n      monsterTurn(); endTurn();\\n    }\\n\\n    /* ================= 怪物回合（全新状态机） ================= */\\n    function monsterTurn() {\\n      /* 先处理远程怪的特殊攻击，再统一走位 */\\n      for (var i = 0; i < mons.length; i++) {\\n        var m = mons[i];\\n        if (m.hp <= 0) continue;\\n        m.anim += 1;\\n        /* 眩晕：刚被震地命中的那一回合不消耗计数（否则眩晕会被当回合白吃） */\\n        if (m.stunFresh) { m.stunFresh = 0; log(m.name + ' 被震得踉跄，无法行动。', '#d9a066'); continue; }\\n        if (m.stun > 0) { m.stun--; if (m.stun === 0) log(m.name + ' 恢复了行动。', '#9aa8bd'); continue; }\\n        var d = dist(m.gx, m.gy, p.gx, p.gy);\\n        var sees = d <= m.sense && los(m.gx, m.gy, p.gx, p.gy);\\n        if (d <= 1) { sees = true; m.alerted = true; }\\n        var steps = m.speed;\\n        /* 远程怪：隔空打 */\\n        if (m.ai === 'ranged' && d > 1 && d <= 5 && sees) {\\n          if (m.boss && d <= 6) {\\n            /* Boss：横排喷吐 */\\n            hurtPlayer(m.atk, m.name, '#ff9d7a');\\n            fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#ff7a4b', count: 18 });\\n            if (over) return;\\n            continue;\\n          }\\n          if (d >= 3) {\\n            hurtPlayer(Math.max(1, m.atk - 2 - p.def), m.name + ' 的法术', '#b7a6ff');\\n            fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#b7a6ff', count: 12 });\\n            if (over) return;\\n            continue;\\n          }\\n        }\\n        if (!sees) {\\n          if (m.alerted && m.alertedT > 0) { m.alertedT--; }\\n          /* 巡逻：朝目标点走，到了换一个 */\\n          if (m.speed >= 2 && Math.random() < 0.6) {\\n            if (!m.wpx || dist(m.gx, m.gy, m.wpx, m.wpy) < 1) {\\n              m.wpx = Math.max(1, Math.min(MW - 2, m.gx + rint(-4, 4)));\\n              m.wpy = Math.max(1, Math.min(MH - 2, m.gy + rint(-4, 4)));\\n            }\\n            var wp = pathStep(m, m.wpx, m.wpy) || wanderDir(m);\\n            if (wp) { m.gx = wp[0]; m.gy = wp[1]; }\\n          } else if (Math.random() < 0.22) {\\n            wander(m);\\n          }\\n          continue;\\n        }\\n        m.alerted = true; m.alertedT = 6;\\n        /* 打了就退：血量低或刚打完，先撤一步 */\\n        if (m.ai === 'skit' && m.fleeing > 0) {\\n          m.fleeing--;\\n          var away = retreatStep(m);\\n          if (away) { m.gx = away[0]; m.gy = away[1]; continue; }\\n        }\\n        /* 追击：BFS 找最短路径（绕过墙角） */\\n        for (var s = 0; s < steps; s++) {\\n          var nd = dist(m.gx, m.gy, p.gx, p.gy);\\n          if (nd <= 1) break;\\n          var step = pathStep(m, p.gx, p.gy) || greedyStep(m);\\n          if (!step) break;\\n          m.gx = step[0]; m.gy = step[1];\\n        }\\n        /* 贴身攻击 */\\n        if (dist(m.gx, m.gy, p.gx, p.gy) <= 1) {\\n          var dmg = Math.max(1, m.atk + rint(-1, 1) - p.def);\\n          if (p.shield > 0) { var abs = Math.min(p.shield, dmg); p.shield -= abs; dmg -= abs; if (abs) fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#9fd8ff', count: 8 }); }\\n          if (dmg > 0) hurtPlayer(dmg, m.name);\\n          else log('护盾挡下了 ' + m.name + ' 的攻击。', '#9fd8ff');\\n          if (m.poison) { p.poison = 3; log('你中毒了！', '#a0e0a0'); }\\n          if (over) return;\\n          if (m.ai === 'skit') m.fleeing = 2;\\n        }\\n      }\\n    }\\n    function wander(m) {\\n      var d = choice([[1, 0], [-1, 0], [0, 1], [0, -1]]);\\n      var nx = m.gx + d[0], ny = m.gy + d[1];\\n      if (walkable(nx, ny) && !monsterAt(nx, ny) && !(nx === p.gx && ny === p.gy) && !npcAt(nx, ny)) { m.gx = nx; m.gy = ny; }\\n    }\\n    function wanderDir(m) {\\n      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];\\n      for (var i = 0; i < 4; i++) {\\n        var d = dirs[(i + Math.floor(Math.random() * 4)) % 4];\\n        var nx = m.gx + d[0], ny = m.gy + d[1];\\n        if (walkable(nx, ny) && !monsterAt(nx, ny) && !(nx === p.gx && ny === p.gy) && !npcAt(nx, ny)) return [nx, ny];\\n      }\\n      return null;\\n    }\\n    /* 贪心兜底（BFS 失败时用） */\\n    function greedyStep(m) {\\n      var sx = Math.sign(p.gx - m.gx), sy = Math.sign(p.gy - m.gy);\\n      var dx2 = Math.abs(p.gx - m.gx), dy2 = Math.abs(p.gy - m.gy);\\n      var order = dx2 >= dy2 ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];\\n      for (var k = 0; k < 2; k++) {\\n        if (!order[k][0] && !order[k][1]) continue;\\n        var nx = m.gx + order[k][0], ny = m.gy + order[k][1];\\n        if (walkable(nx, ny) && !monsterAt(nx, ny) && !(nx === p.gx && ny === p.gy) && !npcAt(nx, ny)) return [nx, ny];\\n      }\\n      return null;\\n    }\\n    function retreatStep(m) {\\n      var dirs = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];\\n      var best = null, bd = dist(m.gx, m.gy, p.gx, p.gy);\\n      for (var i = 1; i < dirs.length; i++) {\\n        var nx = m.gx + dirs[i][0], ny = m.gy + dirs[i][1];\\n        if (!walkable(nx, ny) || monsterAt(nx, ny) || npcAt(nx, ny) || (nx === p.gx && ny === p.gy)) continue;\\n        var dd = dist(nx, ny, p.gx, p.gy);\\n        if (dd > bd) { bd = dd; best = [nx, ny]; }\\n      }\\n      return best;\\n    }\\n\\n    /* ================= 下楼 / 重开 ================= */\\n    function snapToPlayer() {\\n      player.x = (p.gx + 0.5) * TILE; player.y = (p.gy + 0.5) * TILE;\\n      scene.camera.x = player.x - CW / 2; scene.camera.y = player.y - CH / 2;\\n      scene.camera.target = player;\\n    }\\n    function descend() {\\n      if (floorNo >= MAX_FLOOR) { victory(); return; }\\n      floorNo++;\\n      SFX.stairs();\\n      genLevel();\\n      layout();\\n      snapToPlayer();\\n      /* 每层给一次技能三选一 */\\n      offerSkill();\\n    }\\n    function offerSkill() {\\n      var avail = [];\\n      for (var i = 0; i < SKILLS.length; i++) if (p.skills.indexOf(i) < 0) avail.push(i);\\n      if (!avail.length || floorNo < 2) return;\\n      var pickN = avail[rint(0, avail.length - 1)];\\n      p.skills.push(pickN);\\n      var sk = SKILLS[pickN];\\n      /* 立刻回满能量，鼓励用技能 */\\n      p.energy = p.maxEnergy;\\n      msg('✦ 你领悟了新技能「' + sk.name + '」：' + sk.desc, '#c9a0ff');\\n      msg('  按数字键 1-' + SKILLS.length + ' 释放对应技能（能量满时可用）。', '#9aa8bd');\\n    }\\n    function restart() {\\n      p = newPlayer(); floorNo = 1; over = false; won = false;\\n      killCount = 0; turnCount = 0; combo = 0; comboTimer = 0; bestDamage = 0; shrinesUsed = 0;\\n      shrineOpen = false; shopOpen = false; shopStock = [];\\n      msgLines = [];\\n      if (overlayText) {\\n        overlayText.visible = false; overlaySub.visible = false; overlayBg.visible = false;\\n      }\\n      genLevel(); layout();\\n      snapToPlayer();\\n      log('方向键 / 屏幕键移动，撞怪即攻击，踩木梯下一层。', '#9fd8ff');\\n    }\\n\\n    /* ================= 渲染 ================= */\\n    function sprIndex(i) { return { x: (i % SHEET_COLS) * TS, y: Math.floor(i / SHEET_COLS) * TS }; }\\n    function sprite(ctx, idx, size, flip, alpha) {\\n      var s = sprIndex(idx);\\n      if (alpha != null) ctx.globalAlpha = alpha;\\n      if (flip) { ctx.save(); ctx.scale(-1, 1); ctx.drawImage(sheet, s.x, s.y, TS, TS, -size / 2, -size / 2, size, size); ctx.restore(); }\\n      else ctx.drawImage(sheet, s.x, s.y, TS, TS, -size / 2, -size / 2, size, size);\\n      if (alpha != null) ctx.globalAlpha = 1;\\n    }\\n\\n    /* ---- 地图层：全亮渲染，无迷雾 ---- */\\n    var mapView = new Goba.Entity(0, 0, null);\\n    mapView.z = -20; mapView.body = false;\\n    mapView.customDraw = function (ctx) {\\n      ctx.imageSmoothingEnabled = false;\\n      var cam = scene.camera.ox, camY = scene.camera.oy;\\n      var x0 = Math.max(0, Math.floor(cam / TILE)), x1 = Math.min(MW - 1, Math.ceil((cam + CW) / TILE));\\n      var y0 = Math.max(0, Math.floor(camY / TILE)), y1 = Math.min(MH - 1, Math.ceil((camY + CH) / TILE));\\n      for (var y = y0; y <= y1; y++) {\\n        for (var x = x0; x <= x1; x++) {\\n          var t = map[y][x], idx = -1;\\n          if (t === FLOOR) idx = T.floor[(x * 7 + y * 13) % T.floor.length];\\n          else if (t === STAIRS) idx = T.stairs;\\n          else if (t === WALL) idx = T.wall[(x * 3 + y * 5) % T.wall.length];\\n          if (idx < 0) {\\n            /* 岩层（未开凿的实心石）：画成有纹理的暗石砖，\\n               别留纯黑洞——否则整张图看起来还是\\\"一块块黑的\\\"，像没点亮 */\\n            var shade = ((x * 5 + y * 3) & 3);\\n            ctx.fillStyle = shade === 0 ? '#2b3040' : (shade === 1 ? '#252a38' : '#20242f');\\n            ctx.fillRect(x * TILE, y * TILE, TILE, TILE);\\n            /* 石缝纹理 */\\n            ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;\\n            ctx.strokeRect(x * TILE + 0.5, y * TILE + 0.5, TILE - 1, TILE - 1);\\n            if (shade === 0) {\\n              ctx.fillStyle = 'rgba(255,255,255,.04)';\\n              ctx.fillRect(x * TILE + 8, y * TILE + 8, TILE - 16, TILE - 16);\\n            }\\n            continue;\\n          }\\n          var s = sprIndex(idx);\\n          ctx.drawImage(sheet, s.x, s.y, TS, TS, x * TILE, y * TILE, TILE, TILE);\\n        }\\n      }\\n      /* 陷阱：红色尖刺，看得见才叫\\\"互动\\\" */\\n      for (var ti = 0; ti < traps.length; ti++) {\\n        var tr = traps[ti];\\n        if (tr.gx < x0 || tr.gx > x1 || tr.gy < y0 || tr.gy > y1) continue;\\n        var px = tr.gx * TILE, py = tr.gy * TILE;\\n        ctx.fillStyle = tr.armed ? 'rgba(200,60,60,.30)' : 'rgba(90,90,100,.16)';\\n        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);\\n        if (tr.armed) {\\n          ctx.fillStyle = '#c94b4b';\\n          for (var sp = 0; sp < 3; sp++) {\\n            var sx2 = px + 8 + sp * 6;\\n            ctx.beginPath(); ctx.moveTo(sx2, py + TILE - 6); ctx.lineTo(sx2 + 3, py + 8); ctx.lineTo(sx2 + 6, py + TILE - 6); ctx.closePath(); ctx.fill();\\n          }\\n          ctx.strokeStyle = 'rgba(255,120,120,.7)'; ctx.lineWidth = 1;\\n          ctx.strokeRect(px + 1.5, py + 1.5, TILE - 3, TILE - 3);\\n        }\\n      }\\n      /* 楼梯呼吸光晕 */\\n      for (var yy = y0; yy <= y1; yy++) for (var xx = x0; xx <= x1; xx++) {\\n        if (map[yy][xx] !== STAIRS) continue;\\n        var a = 0.20 + 0.14 * Math.sin(animClock * 3);\\n        ctx.fillStyle = 'rgba(255,214,102,' + a.toFixed(3) + ')';\\n        ctx.fillRect(xx * TILE, yy * TILE, TILE, TILE);\\n      }\\n      /* 墙火把：几处随机点火光，纯氛围 */\\n      var tcount = 0;\\n      for (var ty = y0; ty <= y1; ty++) for (var tx2 = x0; tx2 <= x1; tx2++) {\\n        if (map[ty][tx2] !== WALL) continue;\\n        if ((tx2 * 7 + ty * 11) % 23 !== 0) continue;\\n        if (++tcount > 14) break;\\n        var fa = 0.5 + 0.35 * Math.sin(animClock * 8 + tx2 + ty);\\n        ctx.fillStyle = 'rgba(255,150,60,' + (fa * 0.5).toFixed(2) + ')';\\n        ctx.fillRect(tx2 * TILE + 10, ty * TILE + 4, 12, 12);\\n        ctx.fillStyle = 'rgba(255,220,120,' + fa.toFixed(2) + ')';\\n        ctx.fillRect(tx2 * TILE + 13, ty * TILE + 8, 6, 6);\\n      }\\n    };\\n    scene.add(mapView);\\n\\n    var decorEnts = [];\\n    var npcEnts = [];\\n    var player = new Goba.Entity(0, 0, null);\\n    player.z = 10; player.body = false;\\n    player.customDraw = function (ctx) {\\n      /* 护盾环 */\\n      if (p.shield > 0) {\\n        ctx.strokeStyle = 'rgba(120,200,255,.65)'; ctx.lineWidth = 2;\\n        ctx.beginPath(); ctx.arc(0, 0, TILE * 0.52, 0, Math.PI * 2); ctx.stroke();\\n      }\\n      if (p.hitT > 0 && Math.floor(p.hitT * 24) % 2) ctx.globalAlpha = 0.45;\\n      ctx.imageSmoothingEnabled = false;\\n      sprite(ctx, S.hero, TILE * 0.92, p.fx === -1);\\n      ctx.globalAlpha = 1;\\n      if (p.poison > 0) {\\n        ctx.fillStyle = 'rgba(120,220,120,.45)';\\n        ctx.beginPath(); ctx.arc(0, -TILE * 0.42, 3, 0, Math.PI * 2); ctx.fill();\\n      }\\n      if (p.weapon) { ctx.save(); ctx.translate(TILE * 0.30, TILE * 0.28); sprite(ctx, p.weapon.spr, TILE * 0.48); ctx.restore(); }\\n    };\\n    scene.add(player);\\n\\n    var monEnts = [];\\n    var itemEnts = [];\\n    var trapEnts = [];\\n\\n    function layout() {\\n      decorEnts.forEach(function (e) { e.dead = true; });\\n      monEnts.forEach(function (e) { e.dead = true; });\\n      itemEnts.forEach(function (e) { e.dead = true; });\\n      npcEnts.forEach(function (e) { e.dead = true; });\\n      decorEnts = []; monEnts = []; itemEnts = []; npcEnts = [];\\n      decor.forEach(function (d) {\\n        var e = new Goba.Entity((d.gx + 0.5) * TILE, (d.gy + 0.5) * TILE, null);\\n        e.z = -5; e.body = false;\\n        e.customDraw = function (ctx) { ctx.imageSmoothingEnabled = false; sprite(ctx, d.spr, TILE * 0.9); };\\n        scene.add(e); decorEnts.push(e);\\n      });\\n      npcs.forEach(function (n) {\\n        var e = new Goba.Entity((n.gx + 0.5) * TILE, (n.gy + 0.5) * TILE, null);\\n        e.z = 9; e.body = false;\\n        e.customDraw = function (ctx) {\\n          ctx.imageSmoothingEnabled = false;\\n          var bob = Math.sin(animClock * 2 + n.gx) * 1.6;\\n          ctx.save(); ctx.translate(0, bob);\\n          sprite(ctx, S.merchantF, TILE * 0.92);\\n          ctx.restore();\\n          /* \\\"!\\\" 提示 */\\n          ctx.fillStyle = 'rgba(255,224,138,' + (0.6 + 0.4 * Math.sin(animClock * 4)).toFixed(2) + ')';\\n          ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';\\n          ctx.fillText('$', 0, -TILE * 0.5);\\n        };\\n        scene.add(e); npcEnts.push(e);\\n      });\\n      mons.forEach(function (m) {\\n        var e = new Goba.Entity((m.gx + 0.5) * TILE, (m.gy + 0.5) * TILE, null);\\n        e.z = m.boss ? 11 : 8; e.body = false;\\n        e.customDraw = function (ctx) {\\n          if (m.hp <= 0) return;\\n          ctx.imageSmoothingEnabled = false;\\n          var size = TILE * (m.boss ? 1.25 : (m.elite ? 1.0 : 0.9));\\n          var bob = m.ai === 'swarm' ? Math.sin(animClock * 6 + m.anim) * 1.8 : 0;\\n          ctx.save(); ctx.translate(0, bob);\\n          if (m.hitT > 0 && Math.floor(m.hitT * 24) % 2) ctx.globalAlpha = 0.5;\\n          if (m.elite || m.boss) {\\n            ctx.fillStyle = m.boss ? 'rgba(255,120,60,.25)' : 'rgba(200,120,255,.20)';\\n            ctx.beginPath(); ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2); ctx.fill();\\n          }\\n          sprite(ctx, m.spr, size);\\n          ctx.globalAlpha = 1;\\n          ctx.restore();\\n          if (m.stun > 0) {\\n            ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';\\n            ctx.fillText('★', 0, -TILE * 0.5);\\n          }\\n          /* 血条 */\\n          if (m.hp < m.maxHp) {\\n            var w = size * 0.9, hp = Math.max(0, m.hp / m.maxHp);\\n            ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(-w / 2, -TILE * (m.boss ? 0.72 : 0.62), w, 4);\\n            ctx.fillStyle = hp > 0.5 ? '#68d391' : (hp > 0.25 ? '#f6c445' : '#f56565');\\n            ctx.fillRect(-w / 2, -TILE * (m.boss ? 0.72 : 0.62), w * hp, 4);\\n          }\\n        };\\n        scene.add(e); monEnts.push(e);\\n      });\\n      items.forEach(function (it) {\\n        var e = new Goba.Entity((it.gx + 0.5) * TILE, (it.gy + 0.5) * TILE, null);\\n        e.z = 6; e.body = false; e._iid = it.id;\\n        e.customDraw = function (ctx) {\\n          ctx.imageSmoothingEnabled = false;\\n          var idx = S.gem, size = TILE * 0.72;\\n          if (it.kind === 'potion') idx = it.sub === 'heal' ? S.potionR : (it.sub === 'max' ? S.potionG : (it.sub === 'power' ? S.potionB : S.potionGray));\\n          else if (it.kind === 'chest') idx = T.chest;\\n          else if (it.kind === 'barrel') idx = choiceBarrel(it);\\n          else if (it.kind === 'shrine') idx = T.shrine;\\n          else if (it.kind === 'weapon') idx = WEAPONS[it.wi].spr;\\n          if (it.kind === 'gem') ctx.globalAlpha = 0.75 + 0.25 * Math.sin(animClock * 4 + it.bob);\\n          else if (it.kind === 'chest' || it.kind === 'shrine') {\\n            /* 稀有物品加光晕 */\\n            var ga = 0.18 + 0.12 * Math.sin(animClock * 3 + it.bob);\\n            ctx.fillStyle = it.kind === 'shrine' ? 'rgba(200,120,255,' + ga + ')' : 'rgba(255,220,120,' + ga + ')';\\n            ctx.beginPath(); ctx.arc(0, 0, TILE * 0.6, 0, Math.PI * 2); ctx.fill();\\n          }\\n          sprite(ctx, idx, size);\\n          ctx.globalAlpha = 1;\\n        };\\n        scene.add(e); itemEnts.push(e);\\n      });\\n    }\\n    function choiceBarrel(it) { return (it.id % 2) ? T.barrel : T.barrel2; }\\n\\n    /* ---- HUD ---- */\\n    var hud = new Goba.Entity(0, 0, null);\\n    hud.fixed = true; hud.z = 100; hud.body = false;\\n    hud.customDraw = function (ctx) {\\n      ctx.imageSmoothingEnabled = false;\\n      var hp = Math.max(0, p.hp / p.maxHp);\\n      /* 上：状态条区（0-56） */\\n      ctx.fillStyle = 'rgba(8,10,16,.90)'; ctx.fillRect(0, 0, CW, 56);\\n      /* 下：日志区（56-114），再暗一点，跟状态条区分开 */\\n      ctx.fillStyle = 'rgba(8,10,16,.72)'; ctx.fillRect(0, 56, CW, 62);\\n      ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(0, 55.5, CW, 1);\\n      ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(0, 117.5, CW, 1);\\n      /* 血条 */\\n      ctx.fillStyle = '#2a1d24'; ctx.fillRect(10, 7, 168, 12);\\n      ctx.fillStyle = hp > 0.5 ? '#e05a5a' : (hp > 0.25 ? '#e08b3a' : '#c02b2b');\\n      ctx.fillRect(10, 7, 168 * hp, 12);\\n      if (p.shield > 0) { ctx.fillStyle = 'rgba(120,200,255,.75)'; ctx.fillRect(10, 7, Math.min(168, 168 * (p.shield / p.maxHp)), 12); }\\n      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.strokeRect(10.5, 7.5, 167, 11);\\n      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';\\n      ctx.fillText('体力 ' + Math.max(0, p.hp) + '/' + p.maxHp + (p.shield ? ' (+' + p.shield + ')' : ''), 14, 9);\\n      /* 能量条 */\\n      ctx.fillStyle = '#1d2430'; ctx.fillRect(10, 22, 168, 7);\\n      ctx.fillStyle = '#7ad8ff'; ctx.fillRect(10, 22, 168 * Math.min(1, p.energy / p.maxEnergy), 7);\\n      ctx.fillStyle = '#9aa8bd'; ctx.font = 'bold 9px sans-serif';\\n      ctx.fillText('能量 ' + Math.floor(p.energy) + '/' + p.maxEnergy, 14, 31);\\n      /* 经验条 */\\n      ctx.fillStyle = '#1d2430'; ctx.fillRect(10, 42, 168, 5);\\n      ctx.fillStyle = '#4ecdc4'; ctx.fillRect(10, 42, 168 * Math.min(1, p.xp / p.next), 5);\\n      ctx.fillStyle = '#9aa8bd'; ctx.font = '9px sans-serif';\\n      ctx.fillText('第 ' + floorNo + '/' + MAX_FLOOR + ' 层 · Lv.' + p.lv + ' · 经验 ' + p.xp + '/' + p.next, 10, 48);\\n      /* 右侧数值（给技能格留出 2 列宽度） */\\n      var rightX = CW - 8 - cellW * 2 - 10;\\n      ctx.textAlign = 'right';\\n      ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 12px sans-serif';\\n      ctx.fillText('◆ ' + p.gems, rightX, 7);\\n      ctx.fillStyle = '#c9d4e3'; ctx.font = 'bold 10px sans-serif';\\n      ctx.fillText('攻 ' + totalAtk() + ' · 防 ' + p.def, rightX, 22);\\n      ctx.fillStyle = '#8a97ae'; ctx.font = '9px sans-serif';\\n      ctx.fillText((p.weapon ? p.weapon.name : '赤手空拳'), rightX, 34);\\n      if (combo > 1) { ctx.fillStyle = '#ffd93d'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('连击 x' + combo, rightX, 45); }\\n      /* 技能格：放在状态条最右侧一列（两颗一行，两行放满 4 个），不压日志区 */\\n      var cellW = 22;\\n      var sx0 = CW - 8 - cellW;\\n      for (var i = 0; i < SKILLS.length; i++) {\\n
